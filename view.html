<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TextSharing - 安全便捷的文本分享</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
    <style>
        /* ===== 基础重置与变量 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f3f4f6;
            --card: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #4b5563;
            --text-muted: #9ca3af;
            --border: #e5e7eb;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --danger: #ef4444;
            --burn-bg: #fef3c7;
            --burn-text: #92400e;
        }

        [data-theme="dark"] {
            --bg: #111827;
            --card: #1f2937;
            --text-primary: #f9fafb;
            --text-secondary: #d1d5db;
            --text-muted: #6b7280;
            --border: #374151;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            --burn-bg: #451a03;
            --burn-text: #fbbf24;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text-secondary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .container {
            max-width: 720px;
            width: 100%;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px 40px;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .badge {
            font-size: 11px;
            font-weight: 500;
            background: var(--accent);
            color: #fff;
            padding: 3px 12px;
            border-radius: 20px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .theme-toggle {
            background: var(--border);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.3s ease, color 0.3s ease, transform 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .theme-toggle:hover {
            background: var(--accent);
            color: #fff;
            transform: rotate(20deg);
        }

        /* ===== 元信息条 ===== */
        .meta-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 20px;
            padding: 10px 0 16px 0;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .meta-bar i {
            margin-right: 5px;
            width: 16px;
            text-align: center;
        }

        .meta-bar .highlight {
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* ===== 阅后即焚横幅 ===== */
        .burn-notice {
            background: var(--burn-bg);
            color: var(--burn-text);
            padding: 10px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border-left: 4px solid var(--burn-text);
        }

        .burn-notice i {
            font-size: 16px;
        }

        /* ===== 标题 ===== */
        .title-display {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 16px;
            line-height: 1.3;
            word-break: break-word;
        }

        /* ===== 内容区 ===== */
        .content-box {
            background: var(--bg);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .content-box .label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .content-box .text-content {
            font-size: 15px;
            line-height: 1.8;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
            font-family: "SF Mono", "Menlo", "Monaco", "Consolas", "Courier New", monospace;
        }

        /* ===== 操作按钮组 - 居中 + 等宽 ===== */
        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 16px 0 8px 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.25s ease;
            background: var(--border);
            color: var(--text-secondary);
            flex: 1 1 0;
            min-width: 100px;
            max-width: 180px;
            white-space: nowrap;
            min-height: 44px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn-success {
            background: var(--success);
            color: #fff;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--border);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            background: var(--border);
        }

        /* ===== 分享链接区域 ===== */
        .link-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 2px solid var(--border);
        }

        .link-section .label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .link-box {
            display: flex;
            align-items: center;
            background: var(--bg);
            border-radius: 10px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .link-box input {
            flex: 1;
            padding: 10px 14px;
            border: none;
            background: transparent;
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            font-family: "SF Mono", "Menlo", "Monaco", "Consolas", "Courier New", monospace;
            min-width: 0;
        }

        .link-box .copy-btn {
            padding: 10px 16px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
            white-space: nowrap;
            min-height: 44px;
        }

        .link-box .copy-btn:hover {
            background: var(--accent-hover);
        }

        /* ===== 错误页面 ===== */
        .error-container {
            text-align: center;
            padding: 40px 16px;
        }

        .error-container i {
            font-size: 48px;
            color: var(--danger);
            margin-bottom: 12px;
        }

        .error-container h2 {
            font-size: 22px;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .error-container p {
            color: var(--text-muted);
            font-size: 15px;
        }

        /* ===== 通知弹窗 ===== */
        .copy-notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--text-primary);
            color: var(--bg);
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            transform: translateX(120%);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            z-index: 999;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
        }

        .copy-notification.show {
            transform: translateX(0);
            opacity: 1;
        }

        /* ================================================================ */
        /*  响应式设计 - 移动端优先                                           */
        /* ================================================================ */

        /* 平板及以下 */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 24px 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .title-display {
                font-size: 20px;
            }

            .content-box .text-content {
                font-size: 14px;
            }

            .btn {
                font-size: 13px;
                padding: 8px 12px;
                min-width: 80px;
                flex: 1 1 0;
            }
        }

        /* 手机 */
        @media (max-width: 480px) {
            body {
                padding: 8px;
            }

            .container {
                padding: 16px 12px;
                border-radius: 12px;
            }

            .header {
                flex-direction: row;
                flex-wrap: wrap;
            }

            .header h1 {
                font-size: 18px;
            }

            .badge {
                font-size: 10px;
                padding: 2px 10px;
            }

            .theme-toggle {
                width: 36px;
                height: 36px;
                font-size: 16px;
            }

            .meta-bar {
                font-size: 12px;
                gap: 6px 14px;
                padding: 8px 0 12px 0;
            }

            .title-display {
                font-size: 18px;
                margin-bottom: 12px;
            }

            .content-box {
                padding: 12px 14px;
                margin-bottom: 16px;
            }

            .content-box .text-content {
                font-size: 13px;
                line-height: 1.6;
            }

            /* 按钮在手机上变成上下排列，每个占满宽度 */
            .actions {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .btn {
                flex: none;
                width: 100%;
                max-width: none;
                padding: 10px 16px;
                font-size: 14px;
                justify-content: center;
                min-height: 48px;
            }

            .link-box {
                flex-direction: column;
            }

            .link-box input {
                width: 100%;
                padding: 10px 12px;
                font-size: 12px;
                border-radius: 10px 10px 0 0;
            }

            .link-box .copy-btn {
                width: 100%;
                justify-content: center;
                padding: 10px 12px;
                border-radius: 0 0 10px 10px;
                font-size: 13px;
            }

            .copy-notification {
                top: 12px;
                right: 12px;
                left: 12px;
                padding: 10px 16px;
                font-size: 13px;
                text-align: center;
                justify-content: center;
            }
        }

        /* 极小屏（< 360px） */
        @media (max-width: 360px) {
            .container {
                padding: 12px 8px;
            }

            .header h1 {
                font-size: 16px;
            }

            .title-display {
                font-size: 16px;
            }

            .content-box .text-content {
                font-size: 12px;
            }

            .btn {
                font-size: 12px;
                padding: 8px 12px;
                min-height: 44px;
            }
        }
    </style>
</head>
<body>

    <div id="copyNotification" class="copy-notification">
        <i class="fa fa-check-circle"></i>
        <span id="notificationText">已复制</span>
    </div>

    <div class="container" id="contentContainer">
        <!-- 内容由 JavaScript 动态渲染 -->
    </div>

    <script>
        // ================================================================
        //  配置
        // ================================================================
        const API_BASE_URL = '';

        // ================================================================
        //  主题切换（事件代理 + 图标同步更新）
        // ================================================================

        function initTheme() {
            const isDark = localStorage.getItem('theme') === 'dark' ||
                (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            updateAllThemeIcons();
        }

        function updateAllThemeIcons() {
            const isDark = document.documentElement.hasAttribute('data-theme');
            document.querySelectorAll('.theme-toggle').forEach(btn => {
                const icon = btn.querySelector('i');
                if (icon) {
                    icon.className = isDark ? 'fa fa-sun-o' : 'fa fa-moon-o';
                }
            });
        }

        function toggleTheme() {
            const html = document.documentElement;
            if (html.hasAttribute('data-theme')) {
                html.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
            updateAllThemeIcons();
        }

        document.addEventListener('click', function(e) {
            const btn = e.target.closest('.theme-toggle');
            if (btn) {
                toggleTheme();
            }
        });

        initTheme();

        // ================================================================
        //  通知
        // ================================================================
        function showNotification(message) {
            const el = document.getElementById('copyNotification');
            document.getElementById('notificationText').textContent = message;
            el.classList.add('show');
            clearTimeout(el._timer);
            el._timer = setTimeout(() => el.classList.remove('show'), 3000);
        }

        // ================================================================
        //  复制功能
        // ================================================================
        function copyText() {
            const el = document.querySelector('.text-content');
            if (!el) return;
            copyToClipboard(el.textContent, '文本已复制');
        }

        function copyLink() {
            const input = document.getElementById('shareLinkInput');
            if (!input) return;
            copyToClipboard(input.value, '链接已复制');
        }

        function copyToClipboard(text, message) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => showNotification(message))
                    .catch(() => fallbackCopy(text, message));
            } else {
                fallbackCopy(text, message);
            }
        }

        function fallbackCopy(text, message) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showNotification(message);
            } catch (_) {
                alert('复制失败，请手动复制');
            }
            document.body.removeChild(ta);
        }

        // ================================================================
        //  渲染页面
        // ================================================================
        function renderContent(data) {
            const container = document.getElementById('contentContainer');

            let statusText = '';
            let statusIcon = 'fa-eye';
            if (data.isRead) {
                statusText = '已销毁（阅后即焚）';
                statusIcon = 'fa-fire';
            } else if (data.burnAfterRead) {
                statusText = '等待查看（阅后即焚）';
                statusIcon = 'fa-clock-o';
            } else {
                statusText = '正常（可重复查看）';
                statusIcon = 'fa-check-circle';
            }

            const isDark = document.documentElement.hasAttribute('data-theme');
            const iconClass = isDark ? 'fa-sun-o' : 'fa-moon-o';

            let html = '';

            if (data.burnAfterRead && data.isRead) {
                html += `
                    <div class="burn-notice">
                        <i class="fa fa-fire"></i>
                        <span>该内容为<strong>阅后即焚</strong>，已自动销毁，无法再次查看</span>
                    </div>
                `;
            }

            html += `
                <div class="header">
                    <div class="header-left">
                        <h1>📄 分享的文本</h1>
                        <span class="badge">${data.burnAfterRead ? '🔥 阅后即焚' : '📌 普通分享'}</span>
                    </div>
                    <button class="theme-toggle" aria-label="切换主题">
                        <i class="fa ${iconClass}"></i>
                    </button>
                </div>
            `;

            html += `
                <div class="meta-bar">
                    <span><i class="fa fa-calendar"></i> 创建：<span class="highlight">${data.createdAt}</span></span>
                    <span><i class="fa fa-clock-o"></i> 剩余：<span class="highlight">${data.expireTime}</span></span>
                    <span><i class="fa ${statusIcon}"></i> 状态：<span class="highlight">${statusText}</span></span>
                </div>
            `;

            if (data.title) {
                html += `<div class="title-display">${escapeHtml(data.title)}</div>`;
            }

            html += `
                <div class="content-box">
                    <div class="label"><i class="fa fa-file-text-o"></i> 文本内容</div>
                    <div class="text-content">${escapeHtml(data.content)}</div>
                </div>
            `;

            html += `
                <div class="actions">
                    <button class="btn btn-primary" onclick="copyText()">
                        <i class="fa fa-copy"></i> 复制文本
                    </button>
                    <button class="btn btn-success" onclick="copyLink()">
                        <i class="fa fa-link"></i> 复制链接
                    </button>
                    <button class="btn btn-outline" onclick="window.print()">
                        <i class="fa fa-print"></i> 打印
                    </button>
                </div>
            `;

            html += `
                <div class="link-section">
                    <div class="label"><i class="fa fa-link"></i> 分享链接</div>
                    <div class="link-box">
                        <input type="text" id="shareLinkInput" value="${escapeHtml(data.shareUrl)}" readonly>
                        <button class="copy-btn" onclick="copyLink()">
                            <i class="fa fa-copy"></i> 复制
                        </button>
                    </div>
                </div>
            `;

            container.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderError(message) {
            document.getElementById('contentContainer').innerHTML = `
                <div class="error-container">
                    <i class="fa fa-exclamation-circle"></i>
                    <h2>出错了</h2>
                    <p>${escapeHtml(message)}</p>
                </div>
            `;
        }

        async function loadShareContent() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                renderError('无效的分享 ID，请检查链接');
                return;
            }

            try {
                const resp = await fetch(`/api/view?id=${id}`);
                const result = await resp.json();

                if (result.success) {
                    renderContent(result.data);
                } else {
                    renderError(result.message || '分享不存在或已过期');
                }
            } catch (_) {
                renderError('加载失败，请检查网络或稍后重试');
            }
        }

        document.addEventListener('DOMContentLoaded', loadShareContent);
    </script>
</body>
</html>
